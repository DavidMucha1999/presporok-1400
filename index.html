<style>

  var imgs="apr aug banquet battle bear birth bread build cite conclave council court crecy dec doctor fair feb fire fish fun2 h_apr h_jun h_may h_oct h_sep habemus hunt isabeau jan joust joust2 jul jun knight manesse may meat merch monks mortagne notary oath oct ordin popecard prim ride rob sacre3 sep ship sick sluys stan t_brush t_crack t_grass t_snow t_soil t_wheat tiara travel uni wagen wedding zizka".split(" ");
  var target=0, shown=0, sDone=0, iDone=0, finished=false, gameOk=true;
  function upd(){target=Math.min(1,0.4*(sDone/scripts.length)+0.6*(iDone/imgs.length));}
  imgs.forEach(function(n){var im=new Image();im.onload=im.onerror=function(){iDone++;upd()};im.src="img/"+n+".jpg"});
  var i=0;
  function step(){
    if(i>=scripts.length){return}
    var f=scripts[i++];msg.textContent=f[1];
    var s=document.createElement("script");s.src=f[0];s.async=false;
    s.onload=function(){sDone++;upd();step()};
    s.onerror=function(){if(f[3]){i--;scripts=scripts.slice(0,i).concat(FALL.slice(1));step();return}if(f[2]){sDone++;upd();step();return}gameOk=false;msg.textContent="Hra sa nenačítala. Obnov stránku."};
    document.body.appendChild(s);
  }
  requestAnimationFrame(function(){requestAnimationFrame(step)});
  var lines=["Rozsvecujú sa lampy…","Pripravujú sa záznamy…","Otvára sa kniha rodu…","Ukladajú sa ulice mesta…","Maľujú sa erby…","Vitaj v Prešporku"];
  function tick(){
